version: "3.8"

services:
  # -----------------------------
  # Airflow INIT
  # -----------------------------
  airflow-init:
    build: ./airflow
    container_name: traffic_airflow_init
    dns: ["8.8.8.8"]
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${DB_PASSWORD}@${RDS_HOST}:5433/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      RDS_HOST: ${RDS_HOST}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    entrypoint:
      - /bin/bash
      - -c
      - |
        airflow db migrate && \
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password ${AIRFLOW_ADMIN_PASSWORD:-admin}
    restart: "no"

  # -----------------------------
  # Airflow Webserver
  # -----------------------------
  airflow-webserver:
    build: ./airflow
    container_name: traffic_airflow_webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    dns: ["8.8.8.8"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    environment:
      AIRFLOW__WEBSERVER__WEB_SERVER_TIMEOUT: "300"
      AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: "300"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${DB_PASSWORD}@${RDS_HOST}:5433/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      RDS_HOST: ${RDS_HOST}
      DB_PASSWORD: ${DB_PASSWORD}

    user: 0:0
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/data:/opt/airflow/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8080"
    command: webserver
    restart: always

  # -----------------------------
  # Airflow Scheduler
  # -----------------------------
  airflow-scheduler:
    build: ./airflow
    container_name: traffic_airflow_scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    dns: ["8.8.8.8"]
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${DB_PASSWORD}@${RDS_HOST}:5433/airflow
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      RDS_HOST: ${RDS_HOST}
      DB_PASSWORD: ${DB_PASSWORD}
    user: 0:0
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/data:/opt/airflow/data
      - /var/run/docker.sock:/var/run/docker.sock

    command: scheduler
    restart: always

  # -----------------------------
  # Superset INIT
  # -----------------------------
  superset-init:
    build: ./superset
    container_name: traffic_superset_init
    dns: ["8.8.8.8"]
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      RDS_HOST: ${RDS_HOST}
      DB_PASSWORD: ${DB_PASSWORD}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
    entrypoint:
      - /bin/bash
      - -c
      - |
        sleep 10
        superset db upgrade
        superset fab create-admin \
          --username admin \
          --firstname Admin \
          --lastname User \
          --email admin@local \
          --password ${SUPERSET_ADMIN_PASSWORD:-admin}
        superset init
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py

  # -----------------------------
  # Superset APP
  # -----------------------------
  superset:
    build: ./superset
    container_name: traffic_superset
    depends_on:
      - superset-init
    dns: ["8.8.8.8"]
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      RDS_HOST: ${RDS_HOST}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8088:8088"
    command: >
      /bin/bash -c "superset run -h 0.0.0.0 -p 8088"
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py
    restart: always

    
  pgadmin:
    image: dpage/pgadmin4
    container_name: traffic_pgadmin
    dns: ["8.8.8.8"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: always

  
  dbt:
    build: ./dbt
    container_name: traffic_dbt
    dns: ["8.8.8.8"]
    environment:
      RDS_HOST: ${RDS_HOST}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./dbt:/app

volumes:
  pgadmin_data:

