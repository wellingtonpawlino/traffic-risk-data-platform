name: dbt compile

on:
  push:
    branches: [main]
    paths:
      - "dbt/**"

jobs:
  dbt-compile:
    name: dbt compile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: dbt/requirements.txt

      - name: Install dbt-postgres
        run: pip install -r dbt/requirements.txt

      - name: Create profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          default:
            outputs:
              dev:
                type: postgres
                host: localhost
                user: ci
                password: ci
                port: 5432
                dbname: ci
                schema: analytics
            target: dev
          EOF

      - name: dbt compile
        working-directory: dbt
        run: dbt compile
