name: Airflow DAGs

on:
  push:
    branches: [main]
    paths:
      - "airflow/dags/**"
      - ".github/workflows/ci-airflow.yml"

jobs:
  validate:
    name: syntax check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check syntax
        run: python -m py_compile airflow/dags/*.py
